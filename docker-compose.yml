services:
  omnivoice:
    build:
      context: .
      target: runtime-cpu
    image: omnivoice-cpp:cpu
    container_name: omnivoice-server
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./models:/models:ro
      - ./voices:/voices:ro
      - ./output:/output
    command:
      - "--model"
      - "/models/${MODEL_FILE:-omnivoice-q8_0.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--voices-dir"
      - "/voices"
      - "--device"
      - "cpu"
      - "--threads"
      - "${THREADS:-4}"
      - "--num-step"
      - "${NUM_STEP:-8}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  omnivoice-cuda:
    profiles: ["gpu"]
    build:
      context: .
      target: runtime-cuda
    image: omnivoice-cpp:cuda
    container_name: omnivoice-server-cuda
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./models:/models:ro
      - ./voices:/voices:ro
      - ./output:/output
    command:
      - "--model"
      - "/models/${MODEL_FILE:-omnivoice-q8_0.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--voices-dir"
      - "/voices"
      - "--device"
      - "cuda:0"
      - "--num-step"
      - "${NUM_STEP:-32}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

